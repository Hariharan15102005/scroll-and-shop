server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: scroll-and-shop-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_YourKeyIdHere}
    key-secret: ${RAZORPAY_KEY_SECRET:YourRazorpaySecretHere}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:YourRazorpayWebhookSecretHere}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
    api-key: ${CLOUDINARY_API_KEY:demo_key}
    api-secret: ${CLOUDINARY_API_SECRET:demo_secret}
